{% extends "manage/base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto;">
    <h2>🔐 관리자 로그인</h2>
    {% if error %}
    <p style="margin:0.8rem 0;color:#c62828;font-size:0.9rem;">⚠️ {{ error }}</p>
    {% endif %}
    <form method="post" action="/manage/login" style="display:flex;flex-direction:column;gap:0.8rem;margin-top:1rem;">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="password" name="password" placeholder="관리자 비밀번호" required autofocus
               style="padding:0.6rem 0.8rem;border:1px solid #ddd;border-radius:4px;">
        <button type="submit" class="refresh-btn" style="padding:0.6rem;">로그인</button>
    </form>
</div>
{% endblock %}
