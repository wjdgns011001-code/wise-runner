{% extends "manage/base.html" %}
{% block content %}
<div class="card" style="max-width:460px;margin:1.5rem auto;">
    <div class="flex">
        <h2>📝 기록 수정</h2>
        <a href="/manage/user/{{ r.user_id }}" class="refresh-btn">← 돌아가기</a>
    </div>
    <p style="font-size:0.82rem;color:#888;margin:0.5rem 0 1rem;">거리·시간을 바꾸면 데일리 점수가 자동으로 다시 계산됩니다.</p>
    <form method="post" action="/manage/records/edit/{{ r.id }}" style="display:flex;flex-direction:column;gap:0.7rem;">
        <label class="f">날짜</label>
        <input type="date" name="date" value="{{ r.date }}" required
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">거리 (km)</label>
        <input type="number" step="0.01" name="total_distance" value="{{ r.total_distance }}" required
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">시간 (HH:MM:SS)</label>
        <input type="text" name="total_time" value="{{ r.total_time }}" required
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">평균 페이스</label>
        <input type="text" name="average_pace" value="{{ r.average_pace or '' }}"
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">케이던스</label>
        <input type="text" name="cadence" value="{{ r.cadence or '' }}"
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">평균 심박수</label>
        <input type="text" name="average_heart_rate" value="{{ r.average_heart_rate or '' }}"
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <label class="f">총 칼로리</label>
        <input type="text" name="total_calories" value="{{ r.total_calories or '' }}"
               style="padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
        <button type="submit" class="refresh-btn" style="margin-top:0.5rem;padding:0.6rem;">저장</button>
    </form>
</div>
<style>.f{font-size:0.82rem;color:#666;margin-bottom:-0.3rem;}</style>
{% endblock %}
