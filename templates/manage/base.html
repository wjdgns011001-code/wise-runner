<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="와이즈러너스">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }</script>
    <title>관리도구 - 러닝 트래커</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; }   /* 화면 밖 슬라이드 패널 등으로 인한 가로 스크롤 방지 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        nav {
            background: #1a1a2e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        nav h1 { font-size: 1.2rem; }
        nav a {
            color: #aaa;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active { color: white; background: rgba(255,255,255,0.1); }
        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 { margin-bottom: 1rem; font-size: 1.1rem; color: #1a1a2e; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th { background: #f8f8f8; font-weight: 600; color: #555; }
        tr:hover { background: #fafafa; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-primary { background: #e3f2fd; color: #1565c0; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        .badge-warning { background: #fff3e0; color: #e65100; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .stat-item {
            text-align: center;
            padding: 1.2rem;
            background: #fafafa;
            border-radius: 8px;
        }
        .stat-item .value { font-size: 1.8rem; font-weight: 700; color: #1a1a2e; }
        .stat-item .label { font-size: 0.85rem; color: #888; margin-top: 4px; }
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .pagination {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 1rem;
        }
        .pagination a {
            padding: 0.4rem 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
        }
        .pagination a:hover { background: #eee; }
        .pagination .current {
            padding: 0.4rem 0.8rem;
            font-weight: 600;
        }
        .filter-bar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 0.4rem 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .filter-bar button {
            padding: 0.4rem 1rem;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-bar button:hover { opacity: 0.9; }
        .flex { display: flex; align-items: center; justify-content: space-between; }
        .truncate-id {
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .refresh-btn {
            padding: 0.4rem 1rem;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .refresh-btn:hover { opacity: 0.9; }
        /* 우하단 플로팅 버튼 */
        .fab-group { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; }
        .fab {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            background: #1a1a2e; color: #fff; font-size: 26px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.28); transition: transform 0.15s;
        }
        .fab:hover { transform: scale(1.08); }
        /* 오른쪽 슬라이드 패널 */
        .side-panel {
            position: fixed; top: 0; right: 0; height: 100vh; width: 400px; max-width: 92vw;
            background: #fff; box-shadow: -4px 0 22px rgba(0,0,0,0.18);
            z-index: 1001; flex-direction: column;
            display: none;   /* 닫힘: 화면 밖 가로 오버플로 방지 위해 아예 제거 */
        }
        .side-panel.open { display: flex; }
        .side-panel-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1rem; background: #1a1a2e; color: #fff; font-size: 0.95rem; font-weight: 600;
        }
        .side-panel-head button { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; line-height: 1; }
        .side-panel iframe { flex: 1; border: none; width: 100%; }

        /* ── 모바일 반응형 ── */
        @media (max-width: 640px) {
            nav { flex-wrap: wrap; gap: 0.35rem 0.7rem; padding: 0.7rem 0.9rem; }
            nav h1 { width: 100%; font-size: 1.05rem; margin-bottom: 0.2rem; }
            nav a { padding: 0.3rem 0.5rem; font-size: 0.88rem; }
            .container { margin: 1rem auto; padding: 0 0.6rem; }
            .card { padding: 1rem; overflow-x: auto; }   /* 넓은 표는 가로 스크롤 */
            .card h2 { font-size: 1rem; }
            table { font-size: 0.8rem; }
            th, td { padding: 0.45rem 0.5rem; }
            .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
            .stat-item { padding: 0.9rem; }
            .stat-item .value { font-size: 1.4rem; }
            .side-panel { width: 100vw; max-width: 100vw; }   /* 폰에선 패널을 전체폭으로 */
            .fab { width: 52px; height: 52px; font-size: 23px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <nav>
        <h1>⚙️ 관리도구</h1>
        <a href="/manage" class="{% if active == 'feed' %}active{% endif %}">러닝 피드</a>
        <a href="/manage/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">대시보드</a>
        <a href="/manage/meetings" class="{% if active == 'meetings' %}active{% endif %}">정기모임</a>
        <a href="/manage/events" class="{% if active == 'events' %}active{% endif %}">대회참가기록</a>
        <a href="/manage/marathons" class="{% if active == 'marathons' %}active{% endif %}">대회 알아보기</a>
        <a href="/manage/purchases" class="{% if active == 'purchases' %}active{% endif %}">구매내역</a>
        <a href="/manage/files" class="{% if active == 'files' %}active{% endif %}">자료실</a>
        <a href="/manage/notices" class="{% if active == 'notices' %}active{% endif %}">공지사항</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- 우하단 플로팅 버튼: 웹 채팅 / 사용자 포털 -->
    <div class="fab-group">
        <button class="fab" onclick="togglePanel('portal')" title="사용자 포털">🏃</button>
        <button class="fab" onclick="togglePanel('chat')" title="웹 채팅">💬</button>
    </div>
    <div id="panel-chat" class="side-panel">
        <div class="side-panel-head"><span>💬 웹 채팅</span><button onclick="togglePanel('chat')">✕</button></div>
        <iframe data-src="/chat"></iframe>
    </div>
    <div id="panel-portal" class="side-panel">
        <div class="side-panel-head"><span>🏃 사용자 포털</span><button onclick="togglePanel('portal')">✕</button></div>
        <iframe data-src="/portal"></iframe>
    </div>
    <script>
        function togglePanel(name) {
            const panel = document.getElementById('panel-' + name);
            const other = document.getElementById('panel-' + (name === 'chat' ? 'portal' : 'chat'));
            if (other) other.classList.remove('open');
            const iframe = panel.querySelector('iframe');
            if (!iframe.src && iframe.dataset.src) iframe.src = iframe.dataset.src;
            panel.classList.toggle('open');
        }
    </script>
</body>
</html>
